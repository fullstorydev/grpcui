version: 2

builds:
  - binary: grpcui
    main: ./cmd/grpcui
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - 386
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .Binary }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}osx{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}x86_32{{ else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    files:
      - LICENSE

# Release notes are generated, not hand-written. "github-native" delegates to
# GitHub's own release-notes generator, which lists each merged PR with its
# title, link, and author, credits new contributors, and groups entries
# according to .github/release.yml.
changelog:
  use: github-native

release:
  footer: |
    ## Container images

    * `docker pull fullstorydev/grpcui:{{ .Tag }}`
    * `docker pull ghcr.io/fullstorydev/grpcui:{{ .Tag }}`

brews:
  - name: grpcui
    # Only published when HOMEBREW_TAP_TOKEN is set to a token with write
    # access to the tap; without it, this step is skipped.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    repository:
      owner: fullstorydev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/fullstorydev/grpcui
    description: An interactive web UI for gRPC, along the lines of postman
    license: MIT
    test: |
      system "#{bin}/grpcui", "-version"
